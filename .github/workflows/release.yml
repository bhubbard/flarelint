name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build engine
        run: cargo build --release --target ${{ matrix.target }}

      - name: Assemble npm platform package
        run: node scripts/build-platform-packages.mjs --target ${{ matrix.target }}

      - name: Archive binary for GitHub Release
        shell: bash
        run: |
          mkdir -p release-assets
          EXE="target/${{ matrix.target }}/release/flarelint"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            EXE="${EXE}.exe"
            7z a "release-assets/flarelint-${{ matrix.target }}.zip" "$EXE"
          else
            tar -czf "release-assets/flarelint-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" flarelint
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: npm/
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: release-assets/
          retention-days: 1

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Consolidate release binaries
        run: |
          mkdir -p dist-assets
          find all-artifacts/bin-* -type f -exec cp {} dist-assets/ \;
          cd dist-assets
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-crates:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish crate
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect platform packages
        run: |
          mkdir -p npm
          cp -r artifacts/npm-*/* npm/
          ls -la npm/

      - name: Publish platform packages
        run: |
          for dir in npm/*/; do
            echo "Publishing $dir"
            npm publish "$dir" --access public --provenance || true
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Prepare main package optionalDependencies
        run: node scripts/set-optional-deps.mjs

      - name: Publish main npm package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
